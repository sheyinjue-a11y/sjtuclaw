[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtuclaw"
version = "0.1.0"
description = "A modular learning agent runtime for SJTUClaw Step 0-5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<6",
  "pdfplumber>=0.11,<1",
  "python-pptx>=1,<2",
  "python-dotenv>=0.21,<2",
  "reportlab>=4,<5",
  "tzlocal>=5.4,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=7.4,<9",
  "ruff>=0.9,<1",
]
tokenizer = [
  "tokenizers==0.20.4",
  "transformers==4.46.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sjtuclaw.prompts" = ["*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: calls the real DeepSeek API",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
